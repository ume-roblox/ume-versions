<text x="160" y="72" class="sans" font-size="21" fill="#1d1a24" font-weight="700">From the first line of Luau to the place in Studio</text>
<text x="160" y="108" class="sans" font-size="17" fill="#5a5468">Ume is a family of tools for making Roblox games: a Luau framework to build on, a language server and a</text>
<text x="160" y="136" class="sans" font-size="17" fill="#5a5468">VS Code extension to write it with, a tray app that syncs your project into Studio, and a Studio plugin</text>
<text x="160" y="164" class="sans" font-size="17" fill="#5a5468">to finish the work there. Pick the pieces you need; together they make one path from editor to place.</text>
